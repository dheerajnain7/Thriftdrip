<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fit Swipe — Gen-Z Outfit Inspo</title>
<meta name="description" content="Swipe through daily Gen-Z streetwear outfit inspiration.">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Fit Swipe</h1>
  <p>daily gen-z outfit inspo</p>
</header>

<main id="deck">
  <div id="card">
    <img id="card-img" alt="outfit">
    <div id="card-title"></div>
  </div>
  <div id="hint">← swipe →</div>
</main>

<nav>
  <button id="prev" aria-label="previous">←</button>
  <div id="counter"><span id="idx">1</span> / <span id="total">12</span></div>
  <button id="shuffle" aria-label="shuffle">⤨</button>
  <button id="next" aria-label="next">→</button>
</nav>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
